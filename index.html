<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragons News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #000;
      color: #fff;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #bbb;
      font-size: 13px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .status {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .filter {
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      background: #ddd;
      cursor: pointer;
    }

    .filter.active {
      background: #000;
      color: #fff;
    }

    .article {
      display: block;
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .article:hover {
      transform: translateY(-1px);
    }

    .article.unread {
      border-left: 4px solid #000;
    }

    .article.read {
      opacity: 0.55;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .date {
      font-size: 12px;
      color: #777;
    }

    .source {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Dragons News</h1>
  <p>中日ドラゴンズ ニュースリーダー</p>
</header>

<main class="container">

  <div class="status">
    <button class="filter active" onclick="showArticles('all')">
      すべて
    </button>

    <button class="filter" onclick="showArticles('unread')">
      未読
    </button>

    <button class="filter" onclick="showArticles('read')">
      既読
    </button>
  </div>

  <div id="articles"></div>

</main>

<script>

const articles = [
  {
    id: 1,
    title: "中日ドラゴンズ関連記事をここに表示します",
    date: "2026-08-09",
    url: "https://www.chunichi.co.jp/chuspo"
  },
  {
    id: 2,
    title: "記事をクリックすると元記事を開きます",
    date: "2026-08-09",
    url: "https://www.chunichi.co.jp/chuspo"
  },
  {
    id: 3,
    title: "クリックした記事は既読になります",
    date: "2026-08-08",
    url: "https://www.chunichi.co.jp/chuspo"
  }
];

let readArticles =
  JSON.parse(localStorage.getItem("readArticles") || "[]");

let currentFilter = "all";

function renderArticles() {

  const container = document.getElementById("articles");

  let filtered = articles.filter(article => {

    const isRead = readArticles.includes(article.id);

    if (currentFilter === "read") {
      return isRead;
    }

    if (currentFilter === "unread") {
      return !isRead;
    }

    return true;
  });

  if (filtered.length === 0) {

    container.innerHTML =
      '<div class="empty">表示する記事がありません</div>';

    return;
  }

  container.innerHTML = filtered.map(article => {

    const isRead = readArticles.includes(article.id);

    return `
      <a
        class="article ${isRead ? "read" : "unread"}"
        href="${article.url}"
        target="_blank"
        onclick="markAsRead(${article.id})"
      >
        <div class="title">
          ${article.title}
        </div>

        <div class="date">
          ${article.date}
        </div>

        <div class="source">
          中日スポーツ
        </div>
      </a>
    `;

  }).join("");
}

function markAsRead(id) {

  if (!readArticles.includes(id)) {

    readArticles.push(id);

    localStorage.setItem(
      "readArticles",
      JSON.stringify(readArticles)
    );
  }
}

function showArticles(filter) {

  currentFilter = filter;

  document.querySelectorAll(".filter")
    .forEach(button => button.classList.remove("active"));

  event.target.classList.add("active");

  renderArticles();
}

renderArticles();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragons News</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background: #f4f4f4;
  color: #222;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #111;
  color: #fff;
  padding: 18px 20px;
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 5px 0 0;
  color: #aaa;
  font-size: 13px;
}

/* =========================
   メイン
========================= */

main {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

/* =========================
   ツールバー
========================= */

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.count {
  font-size: 14px;
  color: #555;
}

.buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 20px;
  padding: 8px 14px;
  background: #ddd;
  color: #222;
  cursor: pointer;
}

button.active {
  background: #111;
  color: white;
}

button:hover {
  opacity: 0.8;
}

/* =========================
   更新時刻
========================= */

.updated {
  font-size: 12px;
  color: #888;
  margin-bottom: 15px;
}

/* =========================
   記事
========================= */

.article {
  display: block;

  background: #fff;

  border-radius: 10px;

  padding: 17px;

  margin-bottom: 10px;

  text-decoration: none;

  color: inherit;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);

  transition: 0.15s;
}

.article:hover {
  transform: translateY(-1px);
}

.article.unread {
  border-left: 4px solid #111;
}

.article.read {
  opacity: 0.55;
}

.article-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.5;
}

.article-meta {
  margin-top: 8px;
  font-size: 12px;
  color: #777;
}

.source {
  margin-top: 5px;
  font-size: 12px;
  color: #999;
}

/* =========================
   未読マーク
========================= */

.new {
  display: inline-block;

  margin-left: 6px;

  padding: 2px 6px;

  font-size: 10px;

  border-radius: 4px;

  background: #111;

  color: white;
}

/* =========================
   状態表示
========================= */

.message {
  text-align: center;

  padding: 60px 10px;

  color: #777;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  header h1 {
    font-size: 21px;
  }

  main {
    padding: 15px 10px;
  }

  .article {
    padding: 14px;
  }

  .article-title {
    font-size: 16px;
  }

}

</style>
</head>


<body>


<header>

  <div class="header-inner">

    <h1>
      Dragons News
    </h1>

    <p>
      中日ドラゴンズ ニュースリーダー
    </p>

  </div>

</header>



<main>


  <div class="toolbar">

    <div class="count">

      未読
      <strong id="unreadCount">0</strong>
      件

    </div>


    <div class="buttons">

      <button
        id="allButton"
        class="active"
        onclick="changeFilter('all')">

        すべて

      </button>


      <button
        id="unreadButton"
        onclick="changeFilter('unread')">

        未読

      </button>


      <button
        id="readButton"
        onclick="changeFilter('read')">

        既読

      </button>


      <button
        onclick="loadArticles()">

        更新

      </button>

    </div>

  </div>



  <div
    id="updated"
    class="updated">
  </div>



  <div
    id="articles">

    <div class="message">

      記事を読み込んでいます……

    </div>

  </div>


</main>



<script>


/* =========================
   設定
========================= */

const ARTICLE_FILE =
  "articles.json";


/* =========================
   データ
========================= */

let articles = [];

let currentFilter = "all";


/* =========================
   既読データ
========================= */

let readArticles =
  JSON.parse(

    localStorage.getItem(
      "dragonsReadArticles"
    ) || "[]"

  );


/* =========================
   記事取得
========================= */

async function loadArticles() {

  const container =
    document.getElementById(
      "articles"
    );


  container.innerHTML =
    `
      <div class="message">
        記事を読み込んでいます……
      </div>
    `;


  try {


    const response =
      await fetch(

        ARTICLE_FILE +
        "?t=" +
        Date.now()

      );


    if (!response.ok) {

      throw new Error(
        "記事データを取得できませんでした"
      );

    }


    articles =
      await response.json();


    /*
    新しい順に並べる
    */

    articles.sort(

      (a, b) =>
        new Date(b.date) -
        new Date(a.date)

    );


    renderArticles();


    /*
    更新時刻
    */

    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =

      "最終更新：" +
      now.toLocaleString(
        "ja-JP"
      );


  } catch (error) {


    console.error(error);


    container.innerHTML =
      `
        <div class="message">

          記事を取得できませんでした。<br>

          しばらくしてから
          「更新」を押してください。

        </div>
      `;

  }

}


/* =========================
   記事表示
========================= */

function renderArticles() {


  const container =
    document.getElementById(
      "articles"
    );


  let filtered =
    articles.filter(

      article => {

        const isRead =
          readArticles.includes(
            article.id
          );


        if (
          currentFilter === "read"
        ) {

          return isRead;

        }


        if (
          currentFilter === "unread"
        ) {

          return !isRead;

        }


        return true;

      }

    );


  /*
  記事がない場合
  */

  if (
    filtered.length === 0
  ) {

    container.innerHTML =
      `
        <div class="message">

          表示する記事がありません

        </div>
      `;

    updateUnreadCount();

    return;

  }


  /*
  記事表示
  */

  container.innerHTML =

    filtered.map(

      article => {


        const isRead =
          readArticles.includes(
            article.id
          );


        return `

          <a

            class="article
            ${isRead ? "read" : "unread"}"

            href="${escapeHtml(article.url)}"

            target="_blank"

            rel="noopener noreferrer"

            onclick="markAsRead('${escapeHtml(article.id)}')"

          >

            <div class="article-title">

              ${escapeHtml(
                article.title
              )}

              ${
                !isRead
                ?
                '<span class="new">未読</span>'
                :
                ''
              }

            </div>


            <div class="article-meta">

              ${escapeHtml(
                article.date || ""
              )}

            </div>


            <div class="source">

              ${escapeHtml(
                article.source ||
                "中日スポーツ"
              )}

            </div>

          </a>

        `;

      }

    ).join("");


  updateUnreadCount();

}


/* =========================
   既読
========================= */

function markAsRead(id) {


  if (
    !readArticles.includes(id)
  ) {

    readArticles.push(id);


    localStorage.setItem(

      "dragonsReadArticles",

      JSON.stringify(
        readArticles
      )

    );

  }

}


/* =========================
   未読件数
========================= */

function updateUnreadCount() {


  const count =

    articles.filter(

      article =>
        !readArticles.includes(
          article.id
        )

    ).length;


  document.getElementById(
    "unreadCount"
  ).textContent =
    count;

}


/* =========================
   フィルター
========================= */

function changeFilter(
  filter
) {


  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".buttons button"
    )
    .forEach(

      button =>
        button.classList.remove(
          "active"
        )

    );


  if (
    filter === "all"
  ) {

    document
      .getElementById(
        "allButton"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "unread"
  ) {

    document
      .getElementById(
        "unreadButton"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "read"
  ) {

    document
      .getElementById(
        "readButton"
      )
      .classList.add(
        "active"
      );

  }


  renderArticles();

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(
  text
) {


  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   起動
========================= */

loadArticles();


</script>


</body>
</html>
